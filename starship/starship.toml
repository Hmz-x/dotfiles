"$schema" = 'https://starship.rs/config-schema.json'

# layout
add_newline = true
palette = 'sex_money_magick'
format = """
[┍━](frame)$time$username$hostname$directory$git_branch$git_state$git_status$python$container$jobs$cmd_duration$status
$character"""

# prompt symbol
[character]
success_symbol = '[┕━](frame) [≡](bold accent)[::{{](frame)[\$](bold usd)[}::{](frame)[€](bold eur)[}::{](frame)[¥](bold jpy)[}}::](frame)[≡](bold accent)'
error_symbol   = '[┕━](frame) [≡](bold accent)[::{{](frame)[\$](bold usd)[}::{](frame)[€](bold eur)[}::{](frame)[¥](bold jpy)[}}::](frame)[≡](bold accent)'
vimcmd_symbol  = '[┕━ ≡::{{\$}::{€}::{¥}}::≡](bold mode)'

# modules
[time]
disabled = false
time_format = '%T'
format = '[$time]($style) '
style = 'dim'

[username]
show_always = true
format = '[$user]($style)@'
style_user = 'text'
style_root = 'bold warn'

[hostname]
ssh_only = false
ssh_symbol = 'ssh:'
format = '[$ssh_symbol$hostname]($style):'
style = 'text'

[directory]
truncation_length = 3
read_only = ' ro'
format = '[$path]($style)[$read_only]($read_only_style) '
style = 'bold accent'
read_only_style = 'warn'

[git_branch]
style = 'dim'

[git_status]
style = 'mode'

[python]
style = 'usd'

[container]
style = 'dim'

[jobs]
style = 'accent'

[cmd_duration]
min_time = 2000
format = 'took [$duration]($style) '
style = 'dim'

[status]
disabled = false
format = '[::{$status}::]($style) '
style = 'dim'

# palette (terminal color slots)
[palettes.sex_money_magick]
frame  = '8'
dim    = '8'
text   = '7'
accent = '5'
usd    = '3'
eur    = '14'
jpy    = '13'
warn   = '1'
mode   = '6'
