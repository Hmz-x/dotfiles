# sex_money_magick
# warm ember ground, esoteric accents, plus three magic colors:
# rose (sex), gold (money), crystal violet (magick)

# status bar
set -g status-style "bg=#1d1a14,fg=#ccc2ad"
set -g status-left "#[fg=#15120d,bg=#b58af1,bold] #S #[default] "
set -g window-status-format "#[fg=#7f796b] #I:#W "
set -g window-status-current-format "#[fg=#15120d,bg=#8da46e,bold] #I:#W "
set -g window-status-separator ""

# panes
set -g pane-border-style "fg=#5c574d"
set -g pane-active-border-style "fg=#b58af1"
set -g display-panes-colour "#7f796b"
set -g display-panes-active-colour "#eb85b4"

# messages and prompts
set -g message-style "bg=#1d1a14,fg=#d8af4c"
set -g message-command-style "bg=#1d1a14,fg=#eb85b4"

# copy mode
set -g mode-style "bg=#3d3052,fg=#ccc2ad"
set -g copy-mode-match-style "bg=#3d3052,fg=#ccc2ad"
set -g copy-mode-current-match-style "bg=#d8af4c,fg=#15120d"

# clock
set -g clock-mode-colour "#b58af1"
