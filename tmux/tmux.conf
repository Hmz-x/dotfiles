# Tmux Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @plugin 'robhurring/tmux-uptime'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cpu'
set-option -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-open'

# Plugin configs
set -g @mighty-scroll-by-line 'man fzf neovim lvim vim vi'
set -g @mighty-scroll-select-pane on
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-lvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# Prefix Config
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Miscellaneous
set -sg escape-time 1
set -g base-index 0
bind r source-file ~/.config/tmux/tmux.conf\; display "Reloaded!"
set -g mouse on

# Buffer Manipulation
setw -g mode-keys vi
bind v copy-mode
bind p paste-buffer

# Pane Splitting
bind '[' split-window -v
bind ']' split-window -h

# Pane Selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window Selection
bind n select-window -t :-
bind m select-window -t :+

# Kill pane
bind x kill-pane

# Resize Panes
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r J resize-pane -D 6
bind -r K resize-pane -U 5

# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Status Bar Configuration
set -g status-interval 2
set -g status-left-length 60
set -g status-right-length 100

# Status Icons
set -g @ram_icon "\uf538"
set -g @cpu_icon "\uf2db"
set -g @storage "\uf0a0"

set -g status-right "CPU #{@cpu_icon} #{cpu_percentage} |\
 RAM #{@ram_icon}  #{ram_percentage} |\
 P:#P W:#I  "

# Theme
source-file ~/.config/tmux/sex_money_magick.conf

# Run TPM
run '~/.tmux/plugins/tpm/tpm'
